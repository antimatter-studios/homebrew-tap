# Pull released artifacts from the projects in projects.json and update the
# formulae to the latest version of each.
#
# PULL model, human-gated:
#   * Triggered manually (Run workflow) — never by another repo's pipeline.
#   * Only READS each project's public GitHub Releases (computes the sha256 of
#     the actual downloaded asset); no source repo can push into this tap.
#   * Updates every platform a formula declares (darwin/linux × arm64/x86_64),
#     skipping the ones it does not.
#   * Writes the version + checksum changes to a BRANCH and stops. It does not
#     open the pull request, does not merge, and does not approve. You open the
#     PR from your own machine and squash-merge it — nothing reaches
#     `brew install` users without a person doing both.
#
# No secrets required: pushing an unprotected branch is within the default
# token's `contents: write`. Opening a PR is the step a human does, so no token
# here can propose a change to what brew installs.
name: Sync formulae from releases

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Project to sync ("all" or a single name from projects.json)'
        required: false
        default: 'all'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pull latest releases and update formulae
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          select="${{ github.event.inputs.project }}"
          summary=""

          for name in $(jq -r 'keys[]' projects.json); do
            if [ "$select" != "all" ] && [ "$select" != "$name" ]; then
              continue
            fi
            repo=$(jq -r --arg n "$name" '.[$n].repo' projects.json)
            prefix=$(jq -r --arg n "$name" '.[$n].tag_prefix' projects.json)
            formula=$(jq -r --arg n "$name" '.[$n].formula' projects.json)

            # Newest non-draft release for this project. Map '-' to '~' so
            # `sort -V` orders pre-releases before their final (1.2.0-rc1 < 1.2.0).
            version=$(gh release list --repo "$repo" --limit 200 --json tagName,isDraft \
                        --jq "[.[] | select(.isDraft | not) | .tagName | select(startswith(\"$prefix\"))] | .[]" \
                      | sed "s|^${prefix}||" | tr '-' '~' | sort -V | tail -1 | tr '~' '-')
            if [ -z "$version" ]; then
              echo "::warning::no release found for ${name} on ${repo}"
              continue
            fi

            current=$(jq -r --arg n "$name" '.[$n] // ""' versions.lock)
            if [ "$version" = "$current" ]; then
              echo "${name}: already at ${version}"
              continue
            fi

            full_tag="${prefix}${version}"
            base="https://github.com/${repo}/releases/download/${full_tag}"
            sed -i "s/version \".*\"/version \"${version}\"/" "$formula"

            # Asset naming is per-project. Most use <name>-<version>-<os>-<arch>, but
            # goreleaser's default is <name>_<version>_<os>_<arch> with amd64 rather
            # than x86_64, so a project keeping that convention declares it instead of
            # being renamed to suit this script.
            #
            # The platform tokens double as the marker this script greps for, so they
            # have to be the strings that appear in the url lines.
            asset_template=$(jq -r --arg n "$name" \
              '.[$n].asset // "{name}-{version}-{platform}.tar.gz"' projects.json)
            platforms=$(jq -r --arg n "$name" \
              '(.[$n].platforms // ["darwin-arm64","darwin-x86_64","linux-arm64","linux-x86_64"])[]' projects.json)

            # Hash every platform the formula actually declares, rather than
            # assuming macOS: a formula that ships linux tarballs would otherwise
            # keep its placeholder checksums forever, and a macOS-only formula
            # must not fail because there is no linux asset to fetch.
            for platform in $platforms; do
              grep -q -- "$platform" "$formula" || continue
              asset="${asset_template//\{name\}/$name}"
              asset="${asset//\{version\}/$version}"
              asset="${asset//\{platform\}/$platform}"
              if ! sha=$(curl -fsSL "${base}/${asset}" | sha256sum | cut -d' ' -f1); then
                echo "::error::${asset} is declared by ${formula} but missing from ${full_tag}"
                exit 1
              fi

              # Casks put sha256 BEFORE url, formulae after, and `brew style` enforces
              # each — so the line to rewrite is the sha256 stanza ADJACENT to the url
              # containing this platform token, on whichever side it sits.
              #
              # This was `sed "/${platform}/{n;...}"`, which always took the line after.
              # Against a cask that rewrote the wrong line or none at all, leaving a
              # stale checksum — a silent wrong answer, and the failure mode that
              # matters most here, because a wrong sha256 is only discovered by a user
              # whose `brew install` refuses to run.
              python3 .github/scripts/set-sha256.py "$formula" "$platform" "$sha"
            done

            if grep -q "sha256 \"0\{64\}\"" "$formula"; then
              echo "::error::a placeholder checksum survived in ${formula} — url and sha256 lines may be out of order"
              exit 1
            fi

            tmp=$(mktemp)
            jq --arg n "$name" --arg v "$version" '.[$n] = $v' versions.lock > "$tmp"
            mv "$tmp" versions.lock

            summary="${summary}- ${name}: ${current:-none} → ${version}"$'\n'
            echo "${name}: ${current:-none} → ${version}"
          done

          if git diff --quiet; then
            echo "No formula changes; everything is already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "summary<<SUMMARY_EOF"
            printf '%s' "$summary"
            echo "SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

      # This workflow pushes a branch and stops there. It does NOT open the pull
      # request, deliberately: nothing automated should be able to propose a change to
      # what `brew install` fetches. A person opens the PR from their own machine, which
      # is also the last point at which the diff is looked at by someone.
      #
      # It therefore needs no PAT — the default token can push an unprotected branch.
      - name: Push the changes to a branch
        if: steps.sync.outputs.changed == 'true'
        env:
          SUMMARY: ${{ steps.sync.outputs.summary }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="sync/formulae-${{ github.run_id }}"
          git switch -c "$branch"
          git add Formula/ Casks/ versions.lock
          git commit -m "Sync formulae from upstream releases"
          git push -u origin "$branch"

          {
            echo "### Branch pushed: \`${branch}\`"
            echo
            printf '%s\n' "$SUMMARY"
            echo "Nothing is published yet. To review and publish:"
            echo
            echo '```sh'
            echo "gh pr create --repo ${{ github.repository }} --base main --head ${branch} \\"
            echo "  --title 'Sync formulae from upstream releases'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Pushed ${branch}. Open the PR yourself; this workflow will not."
