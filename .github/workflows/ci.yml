name: CI

# The tap had no pull-request gate at all: every workflow here is
# workflow_dispatch, so a change to a formula or to a release pipeline was only
# ever exercised by running it for real — a broken publish step would surface
# after a 40-minute qemu build, and a malformed formula after someone's
# `brew install` failed.
#
# Nothing here needs credentials, so it runs with read-only permissions.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # actionlint checks workflow syntax, expression types, and runs shellcheck
      # over every `run:` block. Fetched as a release binary and verified against
      # the checksums the project publishes — the same discipline this tap applies
      # to the artifacts it installs, and the reason no third-party action is
      # involved in linting the workflows that hold write access.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          set -euo pipefail
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          asset="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$asset" "${base}/${asset}"
          curl -fsSL -o al-checksums.txt "${base}/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep " ${asset}\$" al-checksums.txt | sha256sum -c -
          tar xzf "$asset" actionlint
          ./actionlint .github/workflows/*.yml

      # A floating tag is a pointer its owner can move, which is how
      # tj-actions/changed-files leaked secrets from tens of thousands of repos in
      # March 2025. These workflows hold contents: write and a PAT, so the pins
      # are load-bearing and worth enforcing rather than trusting to review.
      - name: Every action is pinned to a commit
        run: |
          set -euo pipefail
          # Anchored to the start of a line so this check does not match its own
          # pattern, written inside this very file — which it did on first run.
          unpinned=$(grep -rhoE "^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*\S+" .github/workflows/ \
                     | sed -E "s/^[[:space:]]*-?[[:space:]]*uses:[[:space:]]*//" \
                     | grep -vE "@[0-9a-f]{40}$" || true)
          if [ -n "$unpinned" ]; then
            echo "these action references are not pinned to a 40-character commit SHA:" >&2
            echo "$unpinned" >&2
            echo "" >&2
            echo "pin them, and let dependabot keep them current" >&2
            exit 1
          fi
          echo "all action references are pinned"

  formulae:
    name: Formulae
    # macOS, because `brew` is only preinstalled on the macOS runners — this job
    # asserted otherwise on its first run and failed with "brew: command not
    # found".
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ruby syntax
        run: |
          set -euo pipefail
          for f in Formula/*.rb Casks/*.rb; do
            [ -e "$f" ] || continue
            ruby -c "$f" >/dev/null && echo "  ok  $f"
          done

      - name: brew style
        run: |
          set -euo pipefail
          # `brew style` is the linter brew itself applies, so it catches what
          # ruby -c cannot: deprecated DSL, ordering, over-long descriptions.
          #
          # This used to split the files in two and enforce only the
          # hand-maintained half, because dotman.rb and tacli.rb were written here
          # by their own release pipelines: an offence in a generated file could
          # only be fixed in another repository, so blocking on it would have meant
          # this tap could not merge anything until that repository changed.
          #
          # Both now come from the sync like everything else, so every file here is
          # editable here, and all of them are enforced.
          files=()
          for f in Formula/*.rb Casks/*.rb; do
            [ -e "$f" ] || continue
            files+=("$f")
          done

          if ! brew style "${files[@]}"; then
            echo "::error::brew style rejected a formula" >&2
            exit 1
          fi

      # `brew style` and `brew audit` disagree, and the disagreement is not
      # academic: style AUTOCORRECTS `depends_on macos: ">= :high_sierra"` into
      # `depends_on macos: :high_sierra`, which the brew runtime then refuses to
      # load at all —
      #
      #   Error: Calling `depends_on macos: :high_sierra` is disabled!
      #
      # So a cask can be style-clean and still be impossible to install. Style
      # is a linter; audit is what actually loads the cask the way `brew
      # install` does. Only audit catches that class.
      #
      # Offline on purpose: --online re-downloads every artifact on every PR,
      # which is slow and makes CI fail on someone else's outage. The failure
      # mode above is a load-time error and is caught without the network.
      - name: Register the checkout as a tap
        run: |
          set -euo pipefail
          # audit takes names, not paths (`brew audit <path>` is disabled), so
          # the working copy has to be visible as a real tap. Symlinking THIS
          # checkout — rather than `brew tap`-ing from GitHub, which would fetch
          # main — is what makes a pull request audit its own changes.
          tap_dir="$(brew --repository)/Library/Taps/antimatter-studios/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          ln -sfn "$GITHUB_WORKSPACE" "$tap_dir"
          brew tap | sed 's/^/  tapped: /'

      - name: brew audit
        run: |
          set -euo pipefail
          # Every file is enforced, for the reason given under brew style: nothing
          # here is written by another repository any more, so nothing here is
          # unfixable here.
          fail=0
          for f in Formula/*.rb Casks/*.rb; do
            [ -e "$f" ] || continue
            name="antimatter-studios/tap/$(basename "$f" .rb)"
            case "$f" in
              Casks/*) flag=--cask ;;
              *)       flag=--formula ;;
            esac

            echo "auditing: $name"
            if ! brew audit "$flag" "$name"; then
              echo "::error::brew audit rejected $name" >&2
              fail=1
            fi
          done
          [ "$fail" = 0 ]

      # projects.json drives tap-sync, so a formula it names must exist and a
      # version it records must be sane. A typo here means a sync that silently
      # skips a project, which looks exactly like "nothing to update".
      - name: Registry is consistent
        run: |
          set -euo pipefail
          fail=0
          for name in $(jq -r 'keys[]' projects.json); do
            formula=$(jq -r --arg n "$name" '.[$n].formula' projects.json)
            repo=$(jq -r --arg n "$name" '.[$n].repo' projects.json)
            if [ -z "$repo" ] || [ "$repo" = null ]; then
              echo "$name: no repo in projects.json" >&2
              fail=1
            fi
            if [ ! -f "$formula" ]; then
              echo "$name: projects.json points at $formula, which does not exist" >&2
              fail=1
              continue
            fi
            # The formula's version must match versions.lock, or tap-sync will
            # either re-sync something already current or skip an update.
            locked=$(jq -r --arg n "$name" '.[$n] // ""' versions.lock)
            # Was `grep -oE ... | head -1 | sed ...`, which under `set -euo
            # pipefail` aborted this whole step, with no diagnostic, for any file
            # with no `  version "..."` line — grep exits 1, pipefail promotes
            # that to the assignment, and -e ends the job. `head` closing the pipe
            # early could do the same via SIGPIPE. The `${declared:-no version}`
            # fallback below shows an empty result was meant to be survivable, and
            # was not reachable. One sed, no pipeline: prints the first match and
            # exits 0 either way.
            declared=$(sed -nE '/^  version "/{s/^  version "([^"]+)".*/\1/p;q;}' "$formula")
            if [ -n "$locked" ] && [ "$locked" != "$declared" ]; then
              echo "$name: versions.lock says $locked but $formula declares $declared" >&2
              fail=1
            fi
            echo "  ok  $name → $formula (${declared:-no version})"
          done
          [ "$fail" = 0 ]

      - name: No placeholder checksums
        run: |
          set -euo pipefail
          # A formula added by hand starts with zeroed checksums; one that reaches
          # main with them still in place is unusable and fails at install time.
          if grep -rn 'sha256 "0\{64\}"' Formula/ Casks/ 2>/dev/null; then
            echo "::error::a placeholder checksum reached the formula above" >&2
            exit 1
          fi
          echo "no placeholder checksums"

      # Nothing here caught instantmailcheck being converted from a formula to a
      # cask, because the cask was valid: `ruby -c`, `brew style` and `brew audit`
      # all passed it, and `brew install --cask` would have succeeded. Only
      # running the installed binary failed, and no check does that.
      #
      # Every tool in this tap is a pre-compiled binary built by its own pipeline;
      # none is compiled at install time. So the formula/cask choice is not about
      # building, and for a bare binary a cask costs two things a formula does
      # not:
      #
      #   * Homebrew quarantines what a cask stages. These binaries carry only the
      #     ad-hoc signature a linker applies, so Gatekeeper refuses to execute
      #     one and the first run is killed unless the cask clears the attribute.
      #   * The postflight that clears it calls /usr/bin/xattr, which does not
      #     exist on Linux — and the cask DSL's `system_command` raises on
      #     failure, so the fix for macOS breaks the Linux install.
      #
      # Nothing quarantines what a formula installs, so a formula has neither
      # problem. An `app` bundle is a real cask; a bare binary is a formula.
      - name: Command-line tools ship as formulae
        run: |
          set -euo pipefail

          # This carried an allowlist of casks awaiting conversion — dotman and
          # tacli, whose own pipelines still wrote those files. Both are formulae
          # now, so there is nothing left to exempt and the rule is absolute.
          fail=0
          for f in Casks/*.rb; do
            [ -e "$f" ] || continue
            name=$(basename "$f" .rb)

            # sed rather than `grep | sed`: a cask with no binary stanza makes
            # grep exit 1, and under `pipefail` that would abort the whole step
            # instead of skipping the file. sed prints nothing and exits 0.
            bins=$(sed -nE 's/^[[:space:]]*binary "([^"]+)".*/\1/p' "$f")

            if [ -z "$bins" ]; then
              echo "  ok  $name ships an app bundle, so a cask is right"
              continue
            fi

            echo "::error file=$f::$name ships a bare binary ($bins) as a cask; command-line tools in this tap are formulae — see Formula/chore.rb" >&2
            fail=1
          done
          [ "$fail" = 0 ]

      # Every file here is now written by this repository, via the sync workflow
      # reading public releases and a person merging the result — see #25. A file
      # carrying a generator's DO-NOT-EDIT banner means some other repository has
      # started pushing again, which is how a push from elsewhere could change what
      # `brew install` fetches. It also silently un-does edits made here, because
      # the next release overwrites them.
      - name: Nothing here is written by another repository
        run: |
          set -euo pipefail
          # Matches the banner, not the phrase in prose, so a comment explaining
          # this rule does not trip it. Checked against a file carrying the real
          # GoReleaser header, which it catches.
          if grep -rniE '^#[[:space:]]*(this file was )?generated by' Formula/ Casks/; then
            echo "::error::the file above is generated elsewhere; this tap reads releases and maintains its own files" >&2
            exit 1
          fi
          echo "every formula and cask is maintained here"

  # One check to require, so a job name can change without stranding merges.
  #
  # github-guard sets required status checks by DISCOVERED JOB NAME. That makes
  # renaming a job, refactoring one into a matrix, or letting one skip enough to
  # block every pull request permanently: the required name never reports, GitHub
  # reads that as pending, and there is no failure to point at. It happened to
  # rest-mail in July, when a required `Build` kept being demanded after the job
  # became `Build (linux)`.
  #
  # Requiring only this job removes the whole class. It always runs, and fails
  # only if a job that actually ran failed — skipped counts as success.
  ci:
    name: CI
    needs: [workflows, formulae]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verdict
        run: |
          set -euo pipefail
          workflows='${{ needs.workflows.result }}'
          formulae='${{ needs.formulae.result }}'
          echo "  workflows: $workflows"
          echo "  formulae:  $formulae"
          for r in "$workflows" "$formulae"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a job did not succeed" >&2; exit 1 ;;
            esac
          done
          echo "  all checks that ran passed"
