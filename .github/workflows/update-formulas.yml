name: Update formula checksums

on:
  workflow_dispatch:
    inputs:
      formula:
        description: 'Formula to update (virtiofsd or qemu)'
        required: true
        type: choice
        options:
          - virtiofsd
          - qemu
      version:
        description: 'Version to update to'
        required: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Update virtiofsd formula
        if: inputs.formula == 'virtiofsd'
        run: |
          VER="${{ inputs.version }}"
          BASE="https://github.com/antimatter-studios/homebrew-tap/releases/download/virtiofsd-v${VER}"

          ARM_URL="${BASE}/virtiofsd-${VER}-darwin-arm64.tar.gz"

          ARM_SHA=$(curl -sL "$ARM_URL" | sha256sum | cut -d' ' -f1)

          sed -i "s/version \".*\"/version \"${VER}\"/" Formula/virtiofsd.rb
          sed -i "s/sha256 \".*\"/sha256 \"${ARM_SHA}\"/" Formula/virtiofsd.rb

      - name: Update qemu formula
        if: inputs.formula == 'qemu'
        run: |
          VER="${{ inputs.version }}"
          BASE="https://github.com/antimatter-studios/homebrew-tap/releases/download/qemu-v${VER}"

          ARM_URL="${BASE}/qemu-${VER}-darwin-arm64.tar.gz"

          ARM_SHA=$(curl -sL "$ARM_URL" | sha256sum | cut -d' ' -f1)

          sed -i "s/version \".*\"/version \"${VER}\"/" Formula/qemu.rb
          sed -i "s/sha256 \".*\"/sha256 \"${ARM_SHA}\"/" Formula/qemu.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/
          git commit -m "Update ${{ inputs.formula }} to v${{ inputs.version }}"
          git push
