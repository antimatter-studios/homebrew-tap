name: Build QEMU

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'QEMU version (e.g. 10.2.2)'
        required: true
        default: '10.2.2'

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            artifact: darwin-arm64
            qemu_binary: qemu-system-aarch64
          - runner: macos-15-intel
            arch: x86_64
            artifact: darwin-x86_64
            qemu_binary: qemu-system-x86_64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Install dependencies
        run: |
          brew install glib gnutls jpeg-turbo libpng libslirp libssh \
            libusb lzo ncurses pixman snappy vde zstd ninja meson

      - name: Download QEMU source
        run: |
          curl -LO https://download.qemu.org/qemu-${{ inputs.version }}.tar.xz
          tar xf qemu-${{ inputs.version }}.tar.xz

      - name: Configure QEMU
        working-directory: qemu-${{ inputs.version }}
        run: |
          mkdir build && cd build
          ../configure \
            --prefix=/opt/qemu \
            --enable-vhost-user \
            --disable-vhost-net \
            --disable-vhost-kernel \
            --disable-vhost-vdpa \
            --enable-slirp \
            --enable-cocoa \
            --disable-gtk \
            --disable-sdl \
            --disable-guest-agent \
            --disable-bsd-user

      - name: Build QEMU
        working-directory: qemu-${{ inputs.version }}/build
        run: make -j"$(sysctl -n hw.ncpu)"

      - name: Install
        working-directory: qemu-${{ inputs.version }}/build
        run: |
          # Strip resource forks that cause codesign failures in CI
          xattr -cr .

          # QEMU's install script handles codesigning with HVF entitlement
          make DESTDIR=${{ runner.temp }}/install install

      - name: Verify codesign
        run: |
          # Verify the binary was codesigned with HVF entitlement
          codesign -d --entitlements - ${{ runner.temp }}/install/opt/qemu/bin/${{ matrix.qemu_binary }} 2>&1 | grep -q hypervisor \
            && echo "HVF entitlement: OK" \
            || echo "WARNING: HVF entitlement not found"

      - name: Package
        run: |
          mkdir -p dist
          cd ${{ runner.temp }}/install/opt/qemu
          tar czf ${{ github.workspace }}/dist/qemu-${{ inputs.version }}-${{ matrix.artifact }}.tar.gz \
            bin/ share/

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qemu-${{ matrix.artifact }}
          path: dist/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      # `gh` is preinstalled on the runner, so publishing needs no third-party
      # action. That matters more here than pinning would: this job holds
      # contents: write, and a release-publishing action is the ideal place for a
      # compromised dependency to substitute a binary. The previous
      # softprops/action-gh-release@v2 was also a FLOATING tag — a pointer its
      # owner, or anyone who compromises that repo, can move.
      #
      # GH_REPO is required because this job never checks the repository out; it
      # only downloads artifacts, so gh has no git remote to infer from.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VER: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="qemu-v${VER}"

          # Quoted delimiter: the body contains backticks, which an unquoted
          # heredoc would run as command substitution.
          cat > notes.md <<'NOTES'
          QEMU vVERSION built with `--enable-vhost-user` for macOS virtiofs support.
          Binaries are codesigned with HVF entitlement (Apple Silicon and Intel).

          ## Install via Homebrew
          ```
          brew install antimatter-studios/tap/qemu
          ```
          NOTES
          sed -i "s/^          //; s/vVERSION/v${VER}/" notes.md

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "QEMU v${VER}" --notes-file notes.md
          else
            gh release create "$tag" --title "QEMU v${VER}" --notes-file notes.md
          fi
          gh release upload "$tag" artifacts/*.tar.gz --clobber
